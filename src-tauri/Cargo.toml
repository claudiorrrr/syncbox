[package]
name = "syncbox"
version = "0.1.0"
description = "Simple Mac folder sync over iroh"
authors = ["syncbox"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "syncbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# iroh stack — pinned to compatible pre-release set
iroh = "=1.0.0-rc.0"
iroh-blobs = "0.101"
iroh-docs = "0.99"
iroh-gossip = "0.99"

# file watching
notify = "8"
notify-debouncer-full = "0.7"

# async + utility
tokio = { version = "1", features = ["full"] }
futures-lite = "2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# misc
dirs = "5"
hostname = "0.4"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ignore = "0.4"
walkdir = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
