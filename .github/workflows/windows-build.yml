name: Windows build (experimental)

# Builds a Windows MSI + CLI binary for syncbox.
#
#   * workflow_dispatch  → build only, artifacts attached to the run
#   * push of a v* tag   → build AND attach the MSI + exe to the GitHub
#                          release for that tag (created by scripts/release.sh
#                          for the macOS assets; this just uploads alongside)
#
# Signing is optional: if the repo has WINDOWS_PFX_BASE64 + WINDOWS_PFX_PASSWORD
# secrets, the MSI and exe are Authenticode-signed; otherwise they ship
# unsigned and Windows SmartScreen warns on first run (More info → Run anyway).
# The updater is macOS-only for now (latest.json carries darwin-aarch64 only),
# so Windows installs update by downloading a newer MSI.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Step-level `if:` can't read secrets directly, so fold the presence
      # check into a plain env var here.
      HAS_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install Bun (Tauri frontend tooling)
        uses: oven-sh/setup-bun@v2

      # The pair-server URL is baked in at build time by syncbox-core/build.rs
      # from pair-server.txt (gitignored). Write a placeholder so the build
      # produces a runnable binary; users override at runtime via the
      # SYNCBOX_PAIR_SERVER env var or the Advanced field in the GUI.
      - name: Write pair-server placeholder
        shell: bash
        run: echo "https://pair.syncbox.dev" > pair-server.txt

      - name: Install frontend dependencies
        run: bun install

      - name: Build the CLI binary (syncbox.exe)
        run: cargo build --release -p syncbox-cli

      - name: Build the Tauri app (MSI installer)
        run: bun run tauri build --bundles msi

      # --- collect assets under stable names -----------------------------
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/syncbox.exe dist/syncbox-windows-x64.exe
          cp target/release/bundle/msi/*.msi dist/syncbox-windows-x64.msi

      # --- optional Authenticode signing ---------------------------------
      - name: Sign assets
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1).FullName
          foreach ($f in Get-ChildItem dist\*) {
            & $signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $f.FullName
          }

      # --- workflow_dispatch: keep artifacts on the run ------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: syncbox-windows
          path: dist/*
          if-no-files-found: error

      # --- tag build: attach to the GitHub release -----------------------
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The macOS release.sh may not have created the release yet; create
          # it if missing, then upload (clobbering on re-run).
          gh release view "$TAG" || gh release create "$TAG" --title "syncbox $TAG" --generate-notes
          gh release upload "$TAG" --clobber dist/syncbox-windows-x64.msi dist/syncbox-windows-x64.exe
