name: Windows build (experimental)

# Builds an unsigned Windows MSI + CLI binary for syncbox.
#
# Triggered manually via the Actions tab, or on a version tag push. Code
# signing is not set up yet — the MSI works but Windows SmartScreen will warn
# on first run. The updater is macOS-only for now (latest.json only carries
# darwin-aarch64), so Windows installs must update manually until a signed
# Windows updater channel is added.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Install Bun (Tauri frontend tooling)
        uses: oven-sh/setup-bun@v2

      # The pair-server URL is baked in at build time by syncbox-core/build.rs
      # from pair-server.txt (gitignored). Write a placeholder so the build
      # produces a runnable binary; users can override at runtime via the
      # SYNCBOX_PAIR_SERVER env var or the Advanced field in the GUI.
      - name: Write pair-server placeholder
        shell: bash
        run: echo "https://pair.syncbox.dev" > pair-server.txt

      - name: Install frontend dependencies
        run: bun install

      - name: Build the CLI binary (syncbox.exe)
        run: cargo build --release -p syncbox-cli

      - name: Build the Tauri app (MSI installer)
        run: bun run tauri build --bundles msi

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: syncbox-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: syncbox-cli-windows
          path: target/release/syncbox.exe
          if-no-files-found: error
